
name: Docker Build Test and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train ML model
        run: python train_model.py

      - name: Run ML tests
        run: python -m unittest discover -v

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "$REGISTRY/$IMAGE_NAME:latest" .

      - name: Start test container
        run: |
          docker run -d --name student-result-test \
            -p 8000:8000 \
            "$REGISTRY/$IMAGE_NAME:latest"

      - name: Test health endpoint
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-test
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":85,"internal_marks":75,"assignment_marks":80,"previous_score":78}')

          echo "$response"
          echo "$response" | grep -Eq '"prediction":[01]'

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-test || true

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && success()
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login "$REGISTRY" \
            -u "${{ github.actor }}" --password-stdin

      - name: Publish Docker image
        if: github.event_name != 'pull_request' && success()
        run: |
          docker tag "$REGISTRY/$IMAGE_NAME:latest" \
            "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"

          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:${GITHUB_SHA}"
